name: Validate Status

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/test-native-ci-policy.py
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          STATUS_ADAPTER: node
      - run: npm run build
        env:
          STATUS_ADAPTER: netlify

  native:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
      STATUS_DELIVERY_ENABLED: 'false'
      OUTBOUND_DELIVERY_ENABLED: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: status
          persist-credentials: false
      - name: Read the immutable native owner source pin
        id: owner
        shell: bash
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re
          commit = Path('status/.github/native-owner.commit').read_text().strip()
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Native owner pin must contain one full Git commit SHA')
          print('commit=' + commit)
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: BananaLabs-OSS/Bananapulse
          ref: ${{ steps.owner.outputs.commit }}
          path: bananapulse
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache-dependency-path: bananapulse/native/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: status/package-lock.json
      - name: Check native workflow authority
        working-directory: status
        run: python3 scripts/test-native-ci-policy.py --owner-workflow ../bananapulse/.github/workflows/native.yml
      - name: Test and build the pinned native Go owner
        working-directory: bananapulse/native
        run: |
          go test -mod=readonly -count=1 ./...
          go vet -mod=readonly ./...
          go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/bananapulse-status" ./cmd/status
      - name: Build the current Astro Node application
        working-directory: status
        env:
          STATUS_ADAPTER: node
        run: |
          npm ci
          npm run build
      - name: Verify current native HTTP contracts with delivery disabled
        working-directory: status
        run: |
          python3 scripts/test-native-subscription-http.py --app . --owner "$RUNNER_TEMP/bananapulse-status"
          python3 scripts/test-native-owner-http.py --app . --owner "$RUNNER_TEMP/bananapulse-status"
          python3 scripts/test-native-manual-orchestration-http.py --app . --owner "$RUNNER_TEMP/bananapulse-status"
