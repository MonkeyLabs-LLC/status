name: Propose Bananapulse update

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/update-bananapulse-lock.mjs

      - name: Open tested update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- bananapulse.lock.json Dockerfile; then
            echo 'Already current.'
            exit 0
          fi
          version="$(jq -r .version bananapulse.lock.json)"
          branch="automation/bananapulse-${version}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$branch"
          git add bananapulse.lock.json Dockerfile
          git commit -m "build: update Bananapulse to ${version}"
          git push --force-with-lease origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update Bananapulse to ${version}" \
            --body "Automated version-pin update. Merge only after the composition workflow passes."
